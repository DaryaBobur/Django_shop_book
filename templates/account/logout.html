{% extends "base.html" %}

{% block title %}Вихід з облікового запису{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <div class="mb-3 text-secondary">
                        <span class="fs-1" aria-hidden="true">&#10162;</span>
                    </div>

                    <h1 class="h3 mb-3">Вийти з облікового запису?</h1>
                    <p class="text-muted mb-4">
                        Ви впевнені, що хочете завершити сеанс?
                    </p>

                    <form method="post" action="{% url 'account_logout' %}">
                        {% csrf_token %}

                        {% if redirect_field_value %}
                            <input type="hidden"
                                   name="{{ redirect_field_name }}"
                                   value="{{ redirect_field_value }}">
                        {% endif %}

                        <button type="submit" class="btn btn-danger w-100 mb-3">
                            Так, вийти
                        </button>
                    </form>

                    <a href="{% url 'goods:product' %}"
                       class="btn btn-outline-secondary w-100">
                        Скасувати та повернутися до каталогу
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
