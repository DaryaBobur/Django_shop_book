<div class="row">
    <div class="col-md-4">
        <form action="{{ action }}" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-outline-{% if klass %}{{ klass }}{% else %}primary{% endif %} mb-4">{{ text }}</button>
        </form>
    </div>
</div>
