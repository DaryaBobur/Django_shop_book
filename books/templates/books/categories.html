{% extends "base.html" %}
{% block title %}Категорії{% endblock %}

{% block content %}
<h1 class="text-center my-4">Категорії</h1>

<div class="row">
    <div class="col-md-8 mx-auto my-2">
        <table class="table table-hover">
            {% for object in object_list %}
            <tr>
                <td class="align-middle">
                    <a href="{% url 'books:category_detail' slug=object.slug %}"
                       class="text-decoration-none text-info-emphasis" style="font-size: 18px">
                        {{ object.name }}
                    </a>
                </td>
                <td class="text-end">
                    {% if perms.books.change_category %}
                    <a href="{% url 'books:category_update' slug=object.slug %}"
                       class="btn btn-outline-success btn-sm">
                        Редагувати
                    </a>
                    {% endif %}
                </td>
                <td class="text-end" style="width: 100px;">
                    {% if perms.books.delete_category %}
                    <a href="{% url 'books:category_delete' slug=object.slug %}"
                       class="btn btn-outline-danger btn-sm">
                        Видалити
                    </a>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>

{% endblock %}
